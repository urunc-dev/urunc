apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kubelet-urunc-cleanup
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: kubelet-urunc-cleanup
  template:
    metadata:
      labels:
        name: kubelet-urunc-cleanup
    spec:
      serviceAccountName: urunc-deploy-sa
      hostPID: true
      nodeSelector:
        urunc.io/urunc-runtime: cleanup
      containers:
        - name: kube-urunc-cleanup
          image: ghcr.io/urunc-dev/urunc/urunc-deploy:latest
          imagePullPolicy: Always
          command: ["bash", "-c", "/urunc-artifacts/scripts/install.sh reset"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
          # reset removes the urunc binaries and directories from the node,
          # once the container runtime restarted without the urunc
          # configuration, so it needs the host filesystem mounted at /host,
          # like the urunc-deploy Pod itself.
          volumeMounts:
            - name: host
              mountPath: /host/
      volumes:
        - name: host
          hostPath:
            path: /
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
