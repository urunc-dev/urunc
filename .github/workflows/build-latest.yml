name: 🍜 Build/publish urunc-deploy image

on:
  workflow_call:
    inputs:
      runner-archs:
        type: string
        default: '["amd64", "aarch64"]'
      dockerfiles:
        type: string
        default: 'deployment/urunc-deploy/Dockerfile'
      registry:
        type: string
        default: 'ghcr.io'
      version-tag:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-all:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 600
    permissions:
      contents: read # to check the repository out
      packages: write # for uploading the finished container
      id-token: write # to complete the identity challenge with sigstore/fulcio when running outside of PRs
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    env:
      REGISTRY: ${{ inputs.registry }}
      IMAGE_NAME: ${{ inputs.registry }}/${{ github.repository }}/urunc-deploy
      ARCH: ${{ matrix.arch }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # An image reference may not contain uppercase letters, while
      # github.repository keeps the owner's case.
      - name: Lowercase the image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=${{ env.ARCH }}-

      - name: Compute short commit SHA
        id: vars
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push urunc-deploy-${{ matrix.arch}}
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # master
        with:
          context: .
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          file: ${{ inputs.dockerfiles }}
          provenance: false
          build-args: |
            COMMIT=${{ steps.vars.outputs.SHORT_SHA }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # main

      - name: Sign the published Docker image
        env:
          COSIGN_EXPERIMENTAL: "true"
          DIGEST: ${{steps.build-and-push.outputs.digest}}
        run: |
          cosign sign --yes "${IMAGE_NAME}@${DIGEST}" \
          -a "repo=${{github.repository}}" \
          -a "workflow=${{github.workflow}}" \
          -a "ref=${{github.sha}}"

  manifest:
    needs: [build-all]
    runs-on: ubuntu-24.04
    permissions:
      contents: read # to check the repository out
      packages: write # for uploading the finished container
      id-token: write # to complete the identity challenge with sigstore/fulcio when running outside of PRs
      actions: read # to find the newest run on main
    env:
      REGISTRY: ${{ inputs.registry }}
      IMAGE_NAME: ${{ inputs.registry }}/${{ github.repository }}/urunc-deploy

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # An image reference may not contain uppercase letters, while
      # github.repository keeps the owner's case.
      - name: Lowercase the image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Set the short SHA and the version tag
        run: |
          # Set SHA_SHORT to be used for the manifest
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "SHA_SHORT=${SHORT_SHA}" >> "$GITHUB_ENV"

          # Determine the manifests' TAG
          if [[ ${{ inputs.version-tag }} == true ]]; then
            echo "Version change detected. Using version: $( cat VERSION )."
            echo "TAG=$( cat VERSION )" >> "$GITHUB_ENV"
          else
            echo "Using tag: ${SHORT_SHA}."
            echo "TAG=${SHORT_SHA}" >> "$GITHUB_ENV"
          fi


      - name: Log into registry ${{ inputs.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Process runner architectures and create docker manifest
        id: create-manifest
        # Unlike the default shell, bash sets pipefail, so a failed manifest
        # push fails this step.
        shell: bash
        run: |
          #FIXME: find a way to match runner_archs with the strategy matrix input
          runner_archs='${{ inputs.runner-archs }}'  # Using the input string array
          manifests=()

          # Loop over the architectures and collect the per-arch images
          for arch in $(echo "$runner_archs" | jq -r '.[]'); do
            manifests+=("${IMAGE_NAME}:${arch}-${SHA_SHORT}")
          done

          echo "-------------------- Per-arch images ------------------------------"
          printf '%s\n' "${manifests[@]}"

          # Push under the short SHA only. The version tag and latest follow
          # once cosign has signed the manifest.
          docker manifest create --amend "${IMAGE_NAME}:${SHA_SHORT}" "${manifests[@]}"

          VAR=$(docker manifest push "${IMAGE_NAME}:${SHA_SHORT}" | tail -1)
          echo "manifest_sha=$VAR" >> "$GITHUB_OUTPUT"


      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # main

      - name: Sign the published Docker image
        env:
          COSIGN_EXPERIMENTAL: "true"
          DIGEST: ${{steps.create-manifest.outputs.manifest_sha }}
        run: |
          cosign sign --yes "${IMAGE_NAME}@${DIGEST}" \
          -a "repo=${{github.repository}}" \
          -a "workflow=${{github.workflow}}" \
          -a "ref=${{github.sha}}"

      # buildx keeps the digest of a single manifest list, so the signature
      # covers these tags too. buildx would rewrite the list, and change its
      # digest, if the images had attestations attached.
      - name: Tag the signed manifest
        env:
          DIGEST: ${{ steps.create-manifest.outputs.manifest_sha }}
          GH_TOKEN: ${{ github.token }}
          WF_REF: ${{ github.workflow_ref }}
        run: |
          if [[ "$TAG" != "$SHA_SHORT" ]]; then
            docker buildx imagetools create -t "${IMAGE_NAME}:${TAG}" "${IMAGE_NAME}@${DIGEST}"
          fi
          # Runs on main can overlap, and a re-run keeps its old commit. So
          # only the newest run on main moves latest. A newer run has a
          # higher run number, and a re-run keeps its number. Look for a
          # newer run among the runs created since this commit.
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            # GITHUB_RUN_NUMBER counts the runs of the calling workflow.
            workflow=${WF_REF%@*}
            workflow=${workflow##*/}
            since=$(git show -s --format=%cI "$GITHUB_SHA")
            newer=$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow "$workflow" --branch main \
              --created ">=$since" --limit 100 --json number \
              --jq "map(select(.number > $GITHUB_RUN_NUMBER)) | length")
            if [[ "$newer" == 0 ]]; then
              docker buildx imagetools create -t "${IMAGE_NAME}:latest" "${IMAGE_NAME}@${DIGEST}"
            else
              echo "::notice::A newer run on main moves latest."
            fi
          fi
