name: urunc CI
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      skip-build:
        required: false
        type: string
        default: "no"
      skip-lint:
        required: false
        type: string
        default: "no"
      go_version:
        required: false
        type: string
        default: "1.26.4"

permissions:
  contents: read
  pull-requests: read
  packages: write
  id-token: write
  attestations: write

jobs:
  validate-files-and-commits:
    if: ${{ inputs.skip-lint != 'yes' }}
    name: Lint Files & commits 
    uses: ./.github/workflows/validate-files-and-commits.yml
    with:
      ref: ${{ inputs.ref }}
    secrets: inherit

  lint:
    name: Lint code
    if: ${{ inputs.skip-lint != 'yes' }}
    uses: ./.github/workflows/lint.yml
    with:
      ref: ${{ inputs.ref }}
      go_version: ${{ inputs.go_version }}
    secrets: inherit

  build:
    if: ${{ inputs.skip-build != 'yes' }}
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ inputs.ref }}
      go_version: ${{ inputs.go_version }}
    secrets: inherit

  unit_test:
    if: ${{ inputs.skip-build != 'yes' }}
    name: Unit tests
    uses: ./.github/workflows/unit_test.yml
    with:
      ref: ${{ inputs.ref }}
      go_version: ${{ inputs.go_version }}
    secrets: inherit

  vm_test:
    if: ${{ inputs.skip-build != 'yes' }}
    needs: [build, unit_test]
    name: E2E test
    uses: ./.github/workflows/vm_test.yml
    with:
      # Run the e2e suite from the base branch, so a PR cannot silently weaken
      # the tests that gate its own binary. Changes under tests/ are exercised
      # with the PR's own test code by e2e-test-changes.yml. Falls back to the
      # caller ref for non-PR runs (nightly/release), where base.sha is empty.
      ref: ${{ github.event.pull_request.base.sha || inputs.ref }}
      go_version: ${{ inputs.go_version }}
      runner-archs: '["amd64", "arm64"]'
      runc_version: '1.3.0'
      containerd_version: '2.1.3'
      cni_version: '1.7.1'
      nerdctl_version: '2.1.3'
      crictl_version: 'v1.30.0'
      firecracker_version: 'v1.7.0'
      cloud_hypervisor_version: 'v50.0'
      solo5_version: 'v0.9.3'
      hyperlight_unikraft_version: 'v0.12.1'
    secrets: inherit

  kind_test:
    if: ${{ inputs.skip-build != 'yes' }}
    needs: [build, unit_test]
    name:  Kubernetes test
    uses: ./.github/workflows/kind_test.yml
    with:
      ref: ${{ inputs.ref }}
      firecracker_version: 'v1.7.0'
      solo5_version: 'v0.9.3'
      runc_version: '1.3.0'
    secrets: inherit

  # The vm_test job above runs the base branch's e2e code. In order to also
  # test changes in the e2e testing code, re-run the vm_test with the changed
  # e2e test code. HOwever, do that only when a change in these files has
  # taken place.
  detect-test-changes:
    if: ${{ github.event_name == 'pull_request' && inputs.skip-build != 'yes' }}
    name: Detect test changes
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tests_changed: ${{ steps.check.outputs.tests_changed }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Check whether the PR touches tests/
        id: check
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const changed = files.some(f => f.filename.startsWith('tests/'));
            core.setOutput('tests_changed', changed ? 'yes' : 'no');

  vm_test_head:
    if: ${{ inputs.skip-build != 'yes' && needs.detect-test-changes.outputs.tests_changed == 'yes' }}
    needs: [build, unit_test, detect-test-changes]
    name: E2E test (PR test code)
    uses: ./.github/workflows/vm_test.yml
    with:
      ref: ${{ inputs.ref }}
      go_version: ${{ inputs.go_version }}
      runner-archs: '["amd64", "arm64"]'
      runc_version: '1.3.0'
      containerd_version: '2.1.3'
      cni_version: '1.7.1'
      nerdctl_version: '2.1.3'
      crictl_version: 'v1.30.0'
      firecracker_version: 'v1.7.0'
      cloud_hypervisor_version: 'v50.0'
      solo5_version: 'v0.9.3'
      hyperlight_unikraft_version: 'v0.12.1'
    secrets: inherit
