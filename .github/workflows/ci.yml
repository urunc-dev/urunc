name: urunc CI
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      skip-build:
        required: false
        type: string
        default: "no"
      skip-lint:
        required: false
        type: string
        default: "no"
      go_version:
        required: false
        type: string
        default: "1.27.3"
      # Optional overrides of the e2e runners and environment versions. An
      # empty value selects the default in vm_test.yml.
      runners:
        type: string
        default: ''
      runc_version:
        type: string
        default: ''
      containerd_version:
        type: string
        default: ''
      cni_version:
        type: string
        default: ''
      nerdctl_version:
        type: string
        default: ''
      crictl_version:
        type: string
        default: ''
      firecracker_version:
        type: string
        default: ''
      cloud_hypervisor_version:
        type: string
        default: ''
      solo5_version:
        type: string
        default: ''
      hluk_version:
        type: string
        default: ''

permissions:
  contents: read
  pull-requests: read
  packages: write
  id-token: write
  attestations: write

jobs:
  validate-files-and-commits:
    if: ${{ inputs.skip-lint != 'yes' }}
    name: Lint Files & commits 
    uses: ./.github/workflows/validate-files-and-commits.yml
    with:
      ref: ${{ inputs.ref }}
    secrets: inherit

  lint:
    name: Lint code
    if: ${{ inputs.skip-lint != 'yes' }}
    uses: ./.github/workflows/lint.yml
    with:
      ref: ${{ inputs.ref }}
      go_version: ${{ inputs.go_version }}
    secrets: inherit

  build:
    if: ${{ inputs.skip-build != 'yes' }}
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ inputs.ref }}
      go_version: ${{ inputs.go_version }}
    secrets: inherit

  unit_test:
    if: ${{ inputs.skip-build != 'yes' }}
    name: Unit tests
    uses: ./.github/workflows/unit_test.yml
    with:
      ref: ${{ inputs.ref }}
      go_version: ${{ inputs.go_version }}
    secrets: inherit

  vm_test:
    if: ${{ inputs.skip-build != 'yes' }}
    needs: [build, unit_test]
    name: E2E test
    uses: ./.github/workflows/vm_test.yml
    with:
      # Run the e2e suite from the base branch, so a PR cannot silently weaken
      # the tests that gate its own binary. Changes to the e2e code or its
      # environment are exercised by the "vm_test_head" step. Falls back to the
      # caller ref for non-PR runs (nightly/release), where base.sha is empty.
      ref: ${{ github.event.pull_request.base.sha || inputs.ref }}
      # Only set by manual dispatches. PR runs leave them empty, so the base
      # branch's e2e code runs with vm_test.yml's default versions.
      runners: ${{ inputs.runners }}
      runc_version: ${{ inputs.runc_version }}
      containerd_version: ${{ inputs.containerd_version }}
      cni_version: ${{ inputs.cni_version }}
      nerdctl_version: ${{ inputs.nerdctl_version }}
      crictl_version: ${{ inputs.crictl_version }}
      firecracker_version: ${{ inputs.firecracker_version }}
      cloud_hypervisor_version: ${{ inputs.cloud_hypervisor_version }}
      solo5_version: ${{ inputs.solo5_version }}
      hluk_version: ${{ inputs.hluk_version }}
    secrets: inherit

  kind_test:
    if: ${{ inputs.skip-build != 'yes' }}
    needs: [build, unit_test]
    name:  Kubernetes test
    uses: ./.github/workflows/kind_test.yml
    with:
      ref: ${{ inputs.ref }}
      firecracker_version: 'v1.7.0'
      solo5_version: 'v0.9.3'
      runc_version: '1.3.0'
    secrets: inherit

  # The vm_test job above runs the base branch's e2e code. In order to also
  # test changes in the e2e testing code or environment, re-run the vm_test
  # with the PR's e2e code. However, do that only when a change in the files
  # that affect the e2e tests ("tests/*", "Makefile", "script/dm_create.sh",
  # ".github/workflows/vm_test.yml") has taken place.
  detect-test-changes:
    if: ${{ github.event_name == 'pull_request' && inputs.skip-build != 'yes' }}
    name: Detect test changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tests_changed: ${{ steps.check.outputs.tests_changed }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Check whether the PR touches files that affect e2e tests
        id: check
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const roots = [
              'tests/',
              'Makefile',
              'script/dm_create.sh',
              '.github/workflows/vm_test.yml',
            ];
            const changed = files.some(f => roots.some(r => f.filename.startsWith(r)));
            core.setOutput('tests_changed', changed ? 'yes' : 'no');

  vm_test_head:
    if: ${{ inputs.skip-build != 'yes' && needs.detect-test-changes.outputs.tests_changed == 'yes' }}
    needs: [build, unit_test, detect-test-changes]
    name: E2E test (PR test code)
    uses: ./.github/workflows/vm_test.yml
    with:
      # Check out the merge commit (github.sha on pull_request events), as this
      # is where GitHub loaded vm_test.yml from. With the PR's head, a branch
      # that predates a change in main's vm_test.yml would run its old tests
      # against main's environment. No other versions are forwarded to
      # vm_test_head, since it only runs on PRs and the only way to override
      # them in that context is to change the default versions.
      ref: ${{ github.sha }}
    secrets: inherit
