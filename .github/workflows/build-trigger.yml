name: 🍜 Build/publish urunc-deploy

on:
  push:
    branches: ["main"]
    paths:
      - 'deployment/urunc-deploy/Dockerfile'
      - 'deployment/urunc-deploy/config.toml'
      - 'deployment/urunc-deploy/scripts/install.sh'
      - 'cmd/**'
      - 'pkg/**'
      - 'internal/**'
      - 'Makefile'
      - 'VERSION'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

# Runs of the same commit push the same per-arch tags, so they wait for
# each other. No run cancels a running build, and only the newest run on
# main moves latest.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}

permissions:
  contents: read

jobs:
  get-changed-files:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version_changed }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check if VERSION file changed
        id: check
        run: |
          # Get commit range
          if [[ "${{ github.event_name }}" == "push" ]]; then
            base_ref="${{ github.event.before }}"
            head_ref="${{ github.sha }}"
            git fetch origin "$base_ref" --depth=1
          else
            # A manual run builds the image without a version tag.
            echo "Manual run. Skipping the VERSION check."
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A failed git diff fails the step, instead of reading as no change.
          changed=$(git diff --name-only "$base_ref" "$head_ref")

          if grep -qx 'VERSION' <<< "$changed"; then
            echo "VERSION file changed"
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION not changed"
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          fi

  build-dockerfiles-deploy:
    name: Build urunc-deploy container image
    needs: get-changed-files
    # A called workflow cannot hold more than its caller grants, so this has
    # to cover what build-latest declares.
    permissions:
      contents: read
      packages: write
      id-token: write
      actions: read
    uses: ./.github/workflows/build-latest.yml
    with:
      runner-archs: '["amd64", "arm64"]'
      dockerfiles: 'deployment/urunc-deploy/Dockerfile'
      version-tag: ${{ needs.get-changed-files.outputs.version == 'true' }}
