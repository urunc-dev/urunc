name: custom VM spawner 
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      # Optional overrides of the runners and of the versions below, e.g. from a
      # manual dispatch. An empty value selects the default.
      runners:
        type: string
        default: ''
      runc_version:
        type: string
        default: ''
      containerd_version:
        type: string
        default: ''
      cni_version:
        type: string
        default: ''
      nerdctl_version:
        type: string
        default: ''
      crictl_version:
        type: string
        default: ''
      firecracker_version:
        type: string
        default: ''
      cloud_hypervisor_version:
        type: string
        default: ''
      solo5_version:
        type: string
        default: ''
      hluk_version:
        type: string
        default: ''

permissions:
  contents: read

# The default versions of the e2e environment are kept here, next to the steps
# that install them, and the callers only pass overrides. On pull_request
# events, the callers' inputs come from the PR merged into main, so they would
# not match a copy of this workflow loaded from another ref. Callers forward
# unset inputs as empty strings, which skip an input's default, hence the
# fallbacks.
env:
  GO_VERSION: '1.27.3'
  RUNC_VERSION: ${{ inputs.runc_version || '1.3.0' }}
  CONTAINERD_VERSION: ${{ inputs.containerd_version || '2.3.7' }}
  CNI_VERSION: ${{ inputs.cni_version || '1.7.1' }}
  NERDCTL_VERSION: ${{ inputs.nerdctl_version || '2.1.3' }}
  CRICTL_VERSION: ${{ inputs.crictl_version || 'v1.30.0' }}
  FIRECRACKER_VERSION: ${{ inputs.firecracker_version || 'v1.7.0' }}
  CLOUD_HYPERVISOR_VERSION: ${{ inputs.cloud_hypervisor_version || 'v50.0' }}
  SOLO5_VERSION: ${{ inputs.solo5_version || 'v0.9.3' }}
  HLUK_VERSION: ${{ inputs.hluk_version || 'v0.18.0' }}

jobs:
  prepare:
    name: VM test
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: ${{ fromJSON(inputs.runners || '["ubuntu-24.04", "ubuntu-24.04-arm"]') }}
        test: ["test_ctr","test_nerdctl","test_crictl","test_docker"]

    steps:
    - name: Validate inputs (prevent command injection)
      shell: bash
      run: |
        # The runner determines the architecture of the binaries and tests.
        ARCH="$(dpkg --print-architecture)"
        if [[ "$ARCH" != "amd64" && "$ARCH" != "arm64" ]]; then
          echo "Unsupported architecture: $ARCH"
          exit 1
        fi
        echo "ARCH=${ARCH}" >> "$GITHUB_ENV"
        for var in GO_VERSION RUNC_VERSION CONTAINERD_VERSION CNI_VERSION \
                   NERDCTL_VERSION CRICTL_VERSION FIRECRACKER_VERSION \
                   CLOUD_HYPERVISOR_VERSION SOLO5_VERSION HLUK_VERSION; do
          value="${!var}"
          if ! [[ "$value" =~ ^v?[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid format for $var: $value"
            exit 1
          fi
        done


    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref }}

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false

    - name: Install base dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git wget build-essential libseccomp-dev pkg-config bc make qemu-system jq
        wget https://s3.nbfc.io/nbfc-assets/github/urunc/bin/virtiofsd
        sudo chmod +x virtiofsd
        sudo mv virtiofsd /usr/libexec/virtiofsd

    - name: Install runc
      run: |
        SAFE_RUNC="${RUNC_VERSION}"
        wget -q "https://github.com/opencontainers/runc/releases/download/v${SAFE_RUNC}/runc.$(dpkg --print-architecture)"
        sudo install -m 755 runc.$(dpkg --print-architecture) /usr/local/sbin/runc
        rm -f ./runc.$(dpkg --print-architecture)

    - name: Install containerd
      run: |
        SAFE_CONTAINERD="${CONTAINERD_VERSION}"
        wget -q "https://github.com/containerd/containerd/releases/download/v${SAFE_CONTAINERD}/containerd-${SAFE_CONTAINERD}-linux-$(dpkg --print-architecture).tar.gz"
        sudo tar Cxzvf /usr/local "containerd-${SAFE_CONTAINERD}-linux-$(dpkg --print-architecture).tar.gz"
        rm -f "containerd-${SAFE_CONTAINERD}-linux-$(dpkg --print-architecture).tar.gz"

    - name: Set up containerd service
      run: |
        SAFE_CONTAINERD="$CONTAINERD_VERSION"
        wget -q "https://raw.githubusercontent.com/containerd/containerd/v${SAFE_CONTAINERD}/containerd.service"
        sudo rm -f /lib/systemd/system/containerd.service
        sudo mv containerd.service /lib/systemd/system/containerd.service
        sudo systemctl daemon-reload
        sudo systemctl enable --now containerd

    - name: Configure containerd
      run: |
        sudo mkdir -p /etc/containerd/
        sudo mv /etc/containerd/config.toml /etc/containerd/config.toml.bak || true
        sudo containerd config default | sudo tee /etc/containerd/config.toml
        sudo systemctl restart containerd

    - name: Setup devmapper
      run: |
        sudo mkdir -p /usr/local/bin/scripts
        sudo cp script/dm_create.sh /usr/local/bin/scripts/dm_create.sh
        sudo chmod 755 /usr/local/bin/scripts/dm_create.sh
        sudo /usr/local/bin/scripts/dm_create.sh
        sudo sed -i "/\[plugins\.'io\.containerd\.snapshotter\.v1\.devmapper'\]/,/^$/d" /etc/containerd/config.toml
        sudo tee -a /etc/containerd/config.toml > /dev/null <<'EOT'
        [plugins.'io.containerd.snapshotter.v1.devmapper']
          pool_name = "containerd-pool"
          root_path = "/var/lib/containerd/io.containerd.snapshotter.v1.devmapper"
          base_image_size = "10GB"
          fs_type = "ext2"
        EOT
        sudo tee -a /etc/containerd/config.toml > /dev/null <<EOT
        [plugins.'io.containerd.cri.v1.runtime'.containerd.runtimes.urunc]
            runtime_type = "io.containerd.urunc.v2"
            container_annotations = ["com.urunc.unikernel.*"]
            pod_annotations = ["com.urunc.unikernel.*"]
            snapshotter = "devmapper"
        EOT
        # Since containerd 2.3, CRI pulls the images of a runtime into its
        # snapshotter, so the transfer service must be able to unpack into
        # devmapper. Setting unpack_config replaces the default overlayfs entry.
        sudo tee -a /etc/containerd/config.toml > /dev/null <<EOT
        [[plugins.'io.containerd.transfer.v1.local'.unpack_config]]
          platform = "linux/$(dpkg --print-architecture)"
          snapshotter = "overlayfs"
        [[plugins.'io.containerd.transfer.v1.local'.unpack_config]]
          platform = "linux/$(dpkg --print-architecture)"
          snapshotter = "devmapper"
        EOT
        sudo systemctl restart containerd

    - name: Setup block-based mountpoint
      run: |
        mkdir /tmp/test_mountpoint
        dd if=/dev/zero of=/tmp/fake_block bs=1M count=200
        mkfs.ext2 /tmp/fake_block
        sudo mount /tmp/fake_block /tmp/test_mountpoint

    - name: Install CNI plugins
      run: |
        SAFE_CNI="${CNI_VERSION}"
        wget -q "https://github.com/containernetworking/plugins/releases/download/v${SAFE_CNI}/cni-plugins-linux-$(dpkg --print-architecture)-v${SAFE_CNI}.tgz"
        sudo mkdir -p /opt/cni/bin
        sudo tar Cxzvf /opt/cni/bin "cni-plugins-linux-$(dpkg --print-architecture)-v${SAFE_CNI}.tgz"
        rm -f "cni-plugins-linux-$(dpkg --print-architecture)-v${SAFE_CNI}.tgz"

    - name: Configure CNI network
      run: |
        sudo mkdir -p /etc/cni/net.d
        sudo tee /etc/cni/net.d/10-containerd-net.conflist > /dev/null <<'EOT'
        {
          "cniVersion": "1.0.0",
          "name": "containerd-net",
          "plugins": [
            {
              "type": "bridge",
              "bridge": "cni0",
              "isGateway": true,
              "ipMasq": true,
              "hairpinMode": true,
              "ipam": {
                "type": "host-local",
                "ranges": [
                  [{ "subnet": "10.88.0.0/16" }]
                ],
                "routes": [
                  { "dst": "0.0.0.0/0" }
                ]
              }
            },
            {
              "type": "portmap",
              "capabilities": { "portMappings": true }
            },
            {
              "type": "firewall"
            }
          ]
        }
        EOT
        sudo systemctl restart containerd

    - name: Install nerdctl
      run: |
        SAFE_NERDCTL="${NERDCTL_VERSION}"
        wget -q "https://github.com/containerd/nerdctl/releases/download/v${SAFE_NERDCTL}/nerdctl-${SAFE_NERDCTL}-linux-$(dpkg --print-architecture).tar.gz"
        sudo tar Cxzvf /usr/local/bin "nerdctl-${SAFE_NERDCTL}-linux-$(dpkg --print-architecture).tar.gz"
        rm -f "nerdctl-${SAFE_NERDCTL}-linux-$(dpkg --print-architecture).tar.gz"

    - name: Install crictl
      run: |
        SAFE_CRI="${CRICTL_VERSION}"
        wget "https://github.com/kubernetes-sigs/cri-tools/releases/download/${SAFE_CRI}/crictl-${SAFE_CRI}-linux-${ARCH}.tar.gz"
        sudo tar zxvf "crictl-${SAFE_CRI}-linux-${ARCH}.tar.gz" -C /usr/local/bin
        rm -f "crictl-${SAFE_CRI}-linux-${ARCH}.tar.gz"
        sudo tee -a /etc/crictl.yaml > /dev/null <<'EOT'
        runtime-endpoint: unix:///run/containerd/containerd.sock
        image-endpoint: unix:///run/containerd/containerd.sock
        timeout: 20
        EOT

    - name: Install Firecracker
      run: |
        SAFE_FC="${FIRECRACKER_VERSION}"
        ARCH="$(uname -m)"
        release_url="https://github.com/firecracker-microvm/firecracker/releases"
        curl -L "${release_url}/download/${SAFE_FC}/firecracker-${SAFE_FC}-${ARCH}.tgz" | tar -xz
        sudo mv "release-${SAFE_FC}-${ARCH}/firecracker-${SAFE_FC}-${ARCH}" /usr/local/bin/firecracker
        rm -fr "release-${SAFE_FC}-${ARCH}"

    - name: Install Firecracker for FreeBSD
      env:
        # FreeBSD needs Firecracker >= 1.12 and v1.7 required for Unikraft
        # cannot boot it Installed under a dedicated name so the stock
        # Firecracker above stays the default for every other runtime.
        FC_FREEBSD_VERSION: v1.16.1
      run: |
        SAFE_FC="${FC_FREEBSD_VERSION}"
        ARCH="$(uname -m)"
        release_url="https://github.com/firecracker-microvm/firecracker/releases"
        curl -L "${release_url}/download/${SAFE_FC}/firecracker-${SAFE_FC}-${ARCH}.tgz" | tar -xz
        sudo mv "release-${SAFE_FC}-${ARCH}/firecracker-${SAFE_FC}-${ARCH}" /usr/local/bin/firecracker-freebsd
        rm -fr "release-${SAFE_FC}-${ARCH}"

    - name: Install Cloud Hypervisor
      run: |
        SAFE_CLOUD_HYPERVISOR="${CLOUD_HYPERVISOR_VERSION}"
        curl -sL "https://github.com/cloud-hypervisor/cloud-hypervisor/releases/download/${SAFE_CLOUD_HYPERVISOR}/cloud-hypervisor-static" -o cloud-hypervisor
        chmod +x cloud-hypervisor
        sudo mv cloud-hypervisor /usr/local/bin/cloud-hypervisor

    - name: Install solo5
      run: |
        SAFE_SOLO5="${SOLO5_VERSION}"
        git clone -b "${SAFE_SOLO5}" https://github.com/Solo5/solo5.git
        cd solo5
        ./configure.sh && make -j$(nproc)
        sudo cp tenders/hvt/solo5-hvt /usr/local/bin
        sudo cp tenders/spt/solo5-spt /usr/local/bin

    - name: Install hyperlight-unikraft
      if: ${{ env.ARCH == 'amd64' }}
      run: |
        SAFE_HLUK="${HLUK_VERSION}"
        # The Linux release binaries are static (musl), so the runner's glibc
        # does not matter.
        release_url="https://github.com/hyperlight-dev/hyperlight-unikraft/releases"
        curl -fsSL "${release_url}/download/${SAFE_HLUK}/hluk-${SAFE_HLUK}-x86_64-unknown-linux-musl.tar.gz" | tar -xz
        sudo install -m0755 hluk /usr/local/bin/hluk
        rm -f hluk

    - name: Download urunc artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: urunc_static_${{ env.ARCH }}-${{ github.run_id }}
        path: ./

    - name: Download containerd-shim-urunc-v2 artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: containerd-shim-urunc-v2_static_${{ env.ARCH }}-${{ github.run_id }}
        path: ./

    - name: Install urunc
      id: install-urunc
      run: |
        chmod +x urunc_static_${ARCH}
        chmod +x containerd-shim-urunc-v2_static_${ARCH}
        sudo mv urunc_static_${ARCH} /usr/local/bin/urunc
        sudo mv containerd-shim-urunc-v2_static_${ARCH} /usr/local/bin/containerd-shim-urunc-v2
        urunc --version

    - name: Configure urunc with debug logging
      run: |
        sudo mkdir -p /etc/urunc
        sudo tee /etc/urunc/config.toml > /dev/null <<'EOF'
        [log]
        level = "debug"
        syslog = true
        EOF

    - name: Configure FreeBSD urunc runtime (newer Firecracker)
      run: |
        # Dedicated urunc config that points at a different Firecracker binary
        # for FreeBSD
        sudo tee /etc/urunc/config-freebsd.toml > /dev/null <<'EOF'
        [log]
        level = "debug"
        syslog = true

        [monitors.firecracker]
        path = "/usr/local/bin/firecracker-freebsd"
        EOF

        sudo tee /usr/local/bin/containerd-shim-urunc-fc-v2 > /dev/null <<'EOF'
        #!/bin/bash
        URUNC_CONFIG_FILE=/etc/urunc/config-freebsd.toml exec /usr/local/bin/containerd-shim-urunc-v2 "$@"
        EOF
        sudo chmod +x /usr/local/bin/containerd-shim-urunc-fc-v2

    - name: Allow unprivileged ICMP sockets
      run: |
        # The ping tests use unprivileged ICMP sockets, which Ubuntu 24.04
        # does not allow by default (ping_group_range is "1 0").
        sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"

    - name: Grant access to /dev/kvm
      if: ${{ env.ARCH == 'amd64' }}
      id: kvm-setup
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Prepare urunc folder
      id: prepare
      run: |
        export GOROOT=$(go env GOROOT)
        export PATH="$GOROOT/bin:$PATH"
        go version
        go env GOROOT
        make prepare

    - name: Wait for CRI network to be ready
      run: |
        for _ in $(seq 1 30); do
          ready=$(sudo crictl info -o json 2>/dev/null | jq -r '.status.conditions[] | select(.type=="NetworkReady") | .status' || true)
          if [ "$ready" = "true" ]; then
            echo "CRI network is ready"
            exit 0
          fi
          sleep 2
        done
        echo "CRI network did not become ready in time"
        ls -l /etc/cni/net.d /opt/cni/bin || true
        sudo crictl info || true
        exit 1

    - name: Run ${{ matrix.test }}
      id: test
      run: |
        # Set up Go environment properly
        export GOROOT=$(go env GOROOT)
        export PATH="$GOROOT/bin:$PATH"
        go version
        go env GOROOT
        if [ "${ARCH}" = "arm64" ]; then
          sudo -E env "PATH=$PATH" "GOROOT=$GOROOT" make ${{ matrix.test }}_Spt
        else
          sudo -E env "PATH=$PATH" "GOROOT=$GOROOT" make ${{ matrix.test }}
        fi

      # Re-run the same suite with urunc's libcontainer runtime enabled,
      # changing the configuration.
    - name: Run ${{ matrix.test }} with libcontainer
      id: test_libcontainer
      run: |
        sudo tee -a /etc/urunc/config.toml > /dev/null <<'EOF'

        [runtime]
        libcontainer = true
        EOF
        export GOROOT=$(go env GOROOT)
        export PATH="$GOROOT/bin:$PATH"
        if [ "${ARCH}" = "arm64" ]; then
          sudo -E env "PATH=$PATH" "GOROOT=$GOROOT" make ${{ matrix.test }}_Spt
        else
          sudo -E env "PATH=$PATH" "GOROOT=$GOROOT" make ${{ matrix.test }} SKIP="Firecracker-unikraft-httpreply-static-net"
        fi

    - name: Dump urunc logs on failure
      if: failure()
      run: |
        echo "=== urunc debug logs ==="
        sudo journalctl --identifier=urunc --no-pager
