name: Upload to S3

on:
  workflow_call:
    secrets:
      AWS_ACCESS_KEY:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    continue-on-error: true

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
      with:
        egress-policy: audit

    - name: Download urunc artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: urunc_static_${{ matrix.arch }}-${{ github.run_id }}
        path: ./

    - name: Download containerd-shim-urunc-v2 artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: containerd-shim-urunc-v2_static_${{ matrix.arch }}-${{ github.run_id }}
        path: ./

    - name: Upload urunc to S3
      uses: cloudkernels/minio-upload@fce268686576f31a8ad0cdecedba954b58e87aee
      with:
        url: https://s3.nbfc.io
        access-key: ${{ secrets.AWS_ACCESS_KEY }}
        secret-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        local-path: urunc_static_${{ matrix.arch }}
        remote-path: nbfc-assets/github/urunc/dist/${{ github.ref_name }}/${{ matrix.arch }}/
        policy: 1

    - name: Upload containerd-shim-urunc-v2 to S3
      uses: cloudkernels/minio-upload@fce268686576f31a8ad0cdecedba954b58e87aee
      with:
        url: https://s3.nbfc.io
        access-key: ${{ secrets.AWS_ACCESS_KEY }}
        secret-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        local-path: containerd-shim-urunc-v2_static_${{ matrix.arch }}
        remote-path: nbfc-assets/github/urunc/dist/${{ github.ref_name }}/${{ matrix.arch }}/
        policy: 1
