name: urunc fuzzing (corpus pruning)

on:
  workflow_dispatch:
  schedule:
    - cron: '30 13 * * 0'

permissions:
  contents: read

# Shared with fuzz_batch.yml. Both download the corpus, change it and upload
# it again, so overlapping runs would overwrite each other's corpus.
concurrency:
  group: clusterfuzzlite-corpus
  cancel-in-progress: false

jobs:
  prune:
    name: ClusterFuzzLite corpus pruning
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Build fuzz targets
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: go

      - name: Prune the corpus
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          language: go
          mode: prune
          fuzz-seconds: 600
